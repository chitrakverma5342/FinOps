name: FinOps Cost Guardian CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Lint & Moto Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Lint Python Code
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 backend/src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Suite with Moto AWS Mocks
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          DYNAMODB_TABLE_NAME: cost-guardian-scan-log
          SNS_TOPIC_ARN: arn:aws:sns:us-east-1:123456789012:cost-guardian-alerts
          API_SECRET_KEY: test-secret-key-123
        run: |
          pytest -v backend/tests/ --cov=backend/src --cov-report=term-missing

  frontend-build:
    name: Frontend Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build Production Bundle (Vite)
        working-directory: dashboard
        run: npm run build
